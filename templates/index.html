<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>False Alarm Detection</title>
</head>
<body>
    <h1>False Alarm Detection Input Form</h1>
    <form action="/predict" method="post">
        <label for="temperature">Ambient Temperature (°C):</label>
        <input type="number" id="temperature" name="temperature" step="0.1" required><br><br>

        <label for="calibration">Calibration (days):</label>
        <input type="number" id="calibration" name="calibration" required><br><br>

        <label for="deposition">Unwanted Substance Deposition (0/1):</label>
        <input type="number" id="deposition" name="deposition" min="0" max="1" required><br><br>

        <label for="humidity">Humidity (%):</label>
        <input type="number" id="humidity" name="humidity" step="0.1" required><br><br>

        <label for="h2s_content">H2S Content (ppm):</label>
        <input type="number" id="h2s_content" name="h2s_content" required><br><br>

        <label for="sensors_detected">Detected by (% of sensors):</label>
        <input type="number" id="sensors_detected" name="sensors_detected" step="0.1" required><br><br>

        <button type="submit">Submit</button>
    </form>
    <button onclick="location.href='/';">Back</button>

</body>
</html>
